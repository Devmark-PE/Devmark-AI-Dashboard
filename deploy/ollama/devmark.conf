# Devmark AI - ajustes de Ollama para un servidor de 2 GB de RAM.
# Se instala como drop-in de systemd: /etc/systemd/system/ollama.service.d/devmark.conf
[Service]
# Un solo modelo en memoria: con 2 GB no caben dos.
Environment="OLLAMA_MAX_LOADED_MODELS=1"
# Una generación a la vez; las demás esperan en cola (evita quedarse sin RAM).
Environment="OLLAMA_NUM_PARALLEL=1"
# Mantener el modelo cargado 24 h: evita la carga en frío (~30 s) tras 5 min sin uso.
Environment="OLLAMA_KEEP_ALIVE=24h"
