# Devmark AI - endurecimiento del bloque HTTPS (/etc/nginx/snippets/)
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
add_header Strict-Transport-Security "max-age=31536000" always;

# Documentación interna de FastAPI: no pública
location = /docs         { return 404; }
location = /redoc        { return 404; }
location = /openapi.json { return 404; }
location ^~ /docs/       { return 404; }

# API OpenAI-compatible: 20 req/min por IP (ráfaga 10), 4 conexiones simultáneas
location ^~ /v1/ {
    limit_req  zone=devmark_api burst=10 nodelay;
    limit_conn devmark_conn 4;
    include snippets/devmark-proxy.conf;
}

# Login del dashboard: frena la fuerza bruta antes de llegar a la app
location = /api/admin/auth/login {
    limit_req zone=devmark_login burst=5 nodelay;
    include snippets/devmark-proxy.conf;
}

# Subida de documentos RAG (PDF de hasta 8 MB en base64): el límite por defecto de Nginx es 1 MB
location ^~ /api/admin/rag/ {
    client_max_body_size 12m;
    include snippets/devmark-proxy.conf;
}

# 429 en JSON estilo OpenAI
error_page 429 = @devmark_429;
location @devmark_429 {
    default_type application/json;
    return 429 '{"error":{"message":"Rate limit exceeded","type":"rate_limit_error","code":"rate_limit_exceeded"}}';
}
