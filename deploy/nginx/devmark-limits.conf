# Devmark AI - zonas de rate limiting por IP (contexto http, /etc/nginx/conf.d/)
limit_req_zone  $binary_remote_addr zone=devmark_api:10m   rate=20r/m;
limit_req_zone  $binary_remote_addr zone=devmark_login:10m rate=10r/m;
limit_conn_zone $binary_remote_addr zone=devmark_conn:10m;
limit_req_status  429;
limit_conn_status 429;
