[tool.ruff]
line-length = 130
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "B", "I"]
# B008: Depends()/Query() en los argumentos es el patrón estándar de FastAPI.
ignore = ["E501", "B008"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-p no:logging"
filterwarnings = ["ignore::DeprecationWarning"]
