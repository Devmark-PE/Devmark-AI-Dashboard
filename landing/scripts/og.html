<meta charset="utf-8">
<style>
  @font-face { font-family: Braze; src: url("../public/fonts/Braze.woff2") format("woff2"); }
  * { margin: 0; box-sizing: border-box; }
  body { width: 1200px; height: 630px; background: #08090c; color: #f3f4f6; font-family: "Segoe UI", system-ui, sans-serif; position: relative; overflow: hidden; }
  .glow { position: absolute; inset: 0; background: radial-gradient(700px 420px at 85% -5%, rgba(139,124,255,.28), transparent 60%), radial-gradient(520px 360px at 0% 100%, rgba(57,135,229,.16), transparent 60%); }
  .wrap { position: relative; padding: 72px 80px; height: 100%; display: flex; flex-direction: column; justify-content: space-between; }
  .logo { display: flex; align-items: center; gap: 18px; }
  .name { font-family: Braze, sans-serif; font-size: 44px; letter-spacing: .06em; }
  .name span { color: #a6abb8; }
  .badge { background: rgba(139,124,255,.16); color: #a397ff; font-weight: 700; font-size: 22px; letter-spacing: .08em; padding: 6px 12px; border-radius: 10px; }
  h1 { font-size: 76px; line-height: 1.04; font-weight: 650; letter-spacing: -.02em; max-width: 940px; }
  h1 em { font-style: normal; background: linear-gradient(90deg, #a397ff, #3987e5); -webkit-background-clip: text; color: transparent; }
  p { font-size: 28px; color: #a6abb8; }
</style>

  </div>
